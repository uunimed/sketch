<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ღონისძიების მართვა</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans Georgian', sans-serif;
            background-color: #f3f4f6; /* Light gray background to make panels pop */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-animate {
            animation: fadeIn 0.2s ease-out forwards;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* Hide number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icons = {
            User: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>,
            Lock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>,
            Unlock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>,
            Menu: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
            Close: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
            Check: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>,
            Warning: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        };

        const App = () => {
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [showMenuModal, setShowMenuModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [toasts, setToasts] = useState([]);

            const [guests, setGuests] = useState([
                { id: 1, firstName: 'გიორგი', lastName: 'მაისურაძე', status: 'დაზუსტებული', accCost: 50, foodCost: 35 },
                { id: 2, firstName: 'ნინო', lastName: 'ბერიძე', status: 'დასაზუსტებელი', accCost: 0, foodCost: 0 },
                { id: 3, firstName: 'ლევან', lastName: 'გიორგაძე', status: 'დაზუსტებული', accCost: 50, foodCost: 35 },
            ]);

            const [menuItems, setMenuItems] = useState([
                { id: 1, name: 'მწვადი', portion: '30 შამფური', price: 150 },
                { id: 2, name: 'ხაჭაპური', portion: '10 ცალი', price: 0 },
            ]);

            const [newGuest, setNewGuest] = useState({ firstName: '', lastName: '', status: 'დაზუსტებული', accCost: '', foodCost: '' });
            const [newFood, setNewFood] = useState({ name: '', portion: '' });

            // Toast Notification System
            const showToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 4000);
            };

            // Calculations
            const totals = useMemo(() => {
                const confirmedGuests = guests.filter(g => g.status === 'დაზუსტებული');
                const totalConfirmedCount = confirmedGuests.length;
                
                // Costs are calculated based on ALL guests in the list (or adjust if needed to only confirmed)
                // Assuming based on prompt: list shows all, but "სტუმრების რაოდენობა" only shows confirmed count.
                const totalAccCost = guests.reduce((sum, g) => sum + (Number(g.accCost) || 0), 0);
                const totalFoodCost = guests.reduce((sum, g) => sum + (Number(g.foodCost) || 0), 0);
                const totalOverall = totalAccCost + totalFoodCost;
                const totalMenuPrice = menuItems.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
                
                return { totalConfirmedCount, totalAccCost, totalFoodCost, totalOverall, totalMenuPrice };
            }, [guests, menuItems]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === '200011') {
                    setIsAdmin(true);
                    setShowLoginModal(false);
                    setPasswordInput('');
                    showToast('წარმატებით შეხვედით ადმინისტრატორის რეჟიმში', 'success');
                } else {
                    showToast('არასწორი პაროლი, სცადეთ თავიდან', 'error');
                }
            };

            const handleLogout = () => {
                setIsAdmin(false);
                showToast('თქვენ გამოხვედით ადმინისტრატორის რეჟიმიდან', 'success');
            };

            const handleAddGuest = (e) => {
                e.preventDefault();
                if (!newGuest.firstName.trim() || !newGuest.lastName.trim()) return;
                setGuests([...guests, { id: Date.now(), ...newGuest, accCost: Number(newGuest.accCost) || 0, foodCost: Number(newGuest.foodCost) || 0 }]);
                setNewGuest({ firstName: '', lastName: '', status: 'დაზუსტებული', accCost: '', foodCost: '' });
                showToast('სტუმარი წარმატებით დაემატა');
            };

            const handleUpdateGuest = (id, field, value) => {
                setGuests(guests.map(g => g.id === id ? { ...g, [field]: field.includes('Cost') ? (Number(value) || 0) : value } : g));
            };

            const handleDeleteGuest = (id) => {
                setGuests(guests.filter(g => g.id !== id));
                showToast('სტუმარი წაიშალა', 'success');
            };

            const handleAddFood = (e) => {
                e.preventDefault();
                if (!newFood.name.trim() || !newFood.portion.trim()) return;
                setMenuItems([...menuItems, { id: Date.now(), ...newFood, price: 0 }]);
                setNewFood({ name: '', portion: '' });
                showToast('კერძი დაემატა მენიუში');
            };

            const handleUpdateFoodPrice = (id, price) => {
                setMenuItems(menuItems.map(item => item.id === id ? { ...item, price: Number(price) || 0 } : item));
            };
            
            const handleDeleteFood = (id) => {
                setMenuItems(menuItems.filter(item => item.id !== id));
                showToast('კერძი წაიშალა', 'success');
            };

            return (
                <div className="min-h-screen flex flex-col relative overflow-hidden">
                    
                    {/* Header: Edge to Edge with 1cm padding */}
                    <header className="bg-white border-b border-gray-200 shadow-sm w-full">
                        <div className="w-full px-[1cm] h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="bg-indigo-600 text-white p-3 rounded-xl shadow-md">
                                    <Icons.User />
                                </div>
                                <h1 className="text-2xl font-bold text-gray-900 tracking-tight">ღონისძიების მართვა</h1>
                            </div>
                            
                            {/* Extreme Top Right Admin Button */}
                            <div>
                                {isAdmin ? (
                                    <button onClick={handleLogout} className="flex items-center gap-2 px-5 py-2.5 bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 rounded-xl text-sm font-bold transition-all shadow-sm">
                                        <Icons.Unlock />
                                        <span>ადმინ. გასვლა</span>
                                    </button>
                                ) : (
                                    <button onClick={() => setShowLoginModal(true)} className="flex items-center gap-2 px-5 py-2.5 bg-gray-900 text-white hover:bg-gray-800 rounded-xl text-sm font-bold transition-all shadow-md hover:shadow-lg">
                                        <Icons.Lock />
                                        <span>ადმინისტრატორი</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Main Content: Edge to Edge Layout with distinct visual divider */}
                    <main className="flex-grow w-full px-[1cm] py-8 flex flex-col lg:flex-row gap-0">
                        
                        {/* LEFT SECTION: Guests */}
                        <div className="flex-1 bg-white rounded-l-2xl shadow-md p-6 lg:p-8 z-10">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-extrabold text-gray-800 border-b-4 border-indigo-500 pb-2 inline-block">სტუმრები</h2>
                            </div>

                            {isAdmin && (
                                <form onSubmit={handleAddGuest} className="mb-6 p-5 bg-indigo-50 border border-indigo-100 rounded-xl grid grid-cols-1 md:grid-cols-6 gap-4 items-end shadow-inner">
                                    <div className="md:col-span-2 space-y-1.5">
                                        <label className="text-xs font-bold text-gray-600 uppercase tracking-wider">სახელი გვარი</label>
                                        <div className="flex gap-2">
                                            <input required type="text" placeholder="სახელი" value={newGuest.firstName} onChange={e => setNewGuest({...newGuest, firstName: e.target.value})} className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                                            <input required type="text" placeholder="გვარი" value={newGuest.lastName} onChange={e => setNewGuest({...newGuest, lastName: e.target.value})} className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                                        </div>
                                    </div>
                                    <div className="space-y-1.5 md:col-span-1">
                                        <label className="text-xs font-bold text-gray-600 uppercase tracking-wider">სტატუსი</label>
                                        <select value={newGuest.status} onChange={e => setNewGuest({...newGuest, status: e.target.value})} className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent cursor-pointer font-medium">
                                            <option value="დაზუსტებული">დაზუსტებული</option>
                                            <option value="დასაზუსტებელი">დასაზუსტებელი</option>
                                        </select>
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-gray-600 uppercase tracking-wider">ბინა (₾)</label>
                                        <input type="number" min="0" placeholder="0" value={newGuest.accCost} onChange={e => setNewGuest({...newGuest, accCost: e.target.value})} className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                                    </div>
                                    <div className="space-y-1.5">
                                        <label className="text-xs font-bold text-gray-600 uppercase tracking-wider">საკვები (₾)</label>
                                        <input type="number" min="0" placeholder="0" value={newGuest.foodCost} onChange={e => setNewGuest({...newGuest, foodCost: e.target.value})} className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" />
                                    </div>
                                    <button type="submit" className="bg-indigo-600 text-white rounded-lg px-4 py-2.5 text-sm font-bold hover:bg-indigo-700 transition-colors flex items-center justify-center gap-1 shadow-md hover:shadow-lg">
                                        <Icons.Plus /> <span>დამატება</span>
                                    </button>
                                </form>
                            )}

                            <div className="overflow-x-auto border border-gray-200 rounded-xl">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-gray-100 border-b border-gray-200 text-gray-600 text-sm uppercase tracking-wider">
                                            <th className="py-4 px-6 font-bold">სახელი/გვარი</th>
                                            <th className="py-4 px-6 font-bold text-center">სტატუსი</th>
                                            <th className="py-4 px-6 font-bold text-right">ბინა</th>
                                            <th className="py-4 px-6 font-bold text-right">საკვები</th>
                                            <th className="py-4 px-6 font-bold text-right">ჯამი</th>
                                            {isAdmin && <th className="py-4 px-6 font-bold w-12"></th>}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {guests.length === 0 ? (
                                            <tr><td colSpan="6" className="py-10 text-center text-gray-400 font-medium">სია ცარიელია</td></tr>
                                        ) : guests.map(guest => (
                                            <tr key={guest.id} className="hover:bg-gray-50 transition-colors group">
                                                <td className="py-4 px-6">
                                                    <div className="font-bold text-gray-900 text-base">{guest.firstName} {guest.lastName}</div>
                                                </td>
                                                <td className="py-4 px-6 text-center">
                                                    {isAdmin ? (
                                                        <select 
                                                            value={guest.status} 
                                                            onChange={(e) => handleUpdateGuest(guest.id, 'status', e.target.value)}
                                                            className={`text-sm font-bold rounded-lg px-3 py-1.5 border-2 outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer text-center ${
                                                                guest.status === 'დაზუსტებული' 
                                                                ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                                                                : 'bg-amber-50 text-amber-700 border-amber-200'
                                                            }`}
                                                        >
                                                            <option value="დაზუსტებული">დაზუსტებული</option>
                                                            <option value="დასაზუსტებელი">დასაზუსტებელი</option>
                                                        </select>
                                                    ) : (
                                                        <span className={`inline-flex items-center px-3 py-1 rounded-lg text-sm font-bold border ${
                                                            guest.status === 'დაზუსტებული' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'
                                                        }`}>
                                                            {guest.status}
                                                        </span>
                                                    )}
                                                </td>
                                                <td className="py-4 px-6 text-right">
                                                    {isAdmin ? (
                                                        <input 
                                                            type="number" min="0" value={guest.accCost} 
                                                            onChange={(e) => handleUpdateGuest(guest.id, 'accCost', e.target.value)}
                                                            className="w-24 text-right bg-white border-2 border-gray-200 rounded-lg px-3 py-1.5 text-sm font-bold focus:outline-none focus:border-indigo-500"
                                                        />
                                                    ) : (
                                                        <span className="font-semibold text-gray-700 text-lg">{guest.accCost} ₾</span>
                                                    )}
                                                </td>
                                                <td className="py-4 px-6 text-right">
                                                    {isAdmin ? (
                                                        <input 
                                                            type="number" min="0" value={guest.foodCost} 
                                                            onChange={(e) => handleUpdateGuest(guest.id, 'foodCost', e.target.value)}
                                                            className="w-24 text-right bg-white border-2 border-gray-200 rounded-lg px-3 py-1.5 text-sm font-bold focus:outline-none focus:border-indigo-500"
                                                        />
                                                    ) : (
                                                        <span className="font-semibold text-gray-700 text-lg">{guest.foodCost} ₾</span>
                                                    )}
                                                </td>
                                                <td className="py-4 px-6 text-right">
                                                    <span className="font-black text-indigo-700 bg-indigo-50 px-3 py-1.5 border border-indigo-100 rounded-lg inline-block min-w-[80px] text-lg text-center shadow-sm">
                                                        {guest.accCost + guest.foodCost} ₾
                                                    </span>
                                                </td>
                                                {isAdmin && (
                                                    <td className="py-4 px-6 text-center">
                                                        <button onClick={() => handleDeleteGuest(guest.id)} className="text-gray-400 hover:text-rose-600 transition-colors p-2 rounded-full hover:bg-rose-50 opacity-0 group-hover:opacity-100">
                                                            <Icons.Trash />
                                                        </button>
                                                    </td>
                                                )}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* VISUAL DIVIDER */}
                        <div className="hidden lg:flex w-6 bg-gray-200 items-center justify-center z-0 relative shadow-inner shadow-gray-300/50">
                            <div className="h-1/2 w-0.5 bg-gray-300 rounded-full"></div>
                        </div>

                        {/* RIGHT SECTION: Summary */}
                        <div className="w-full lg:w-[450px] bg-white rounded-r-2xl shadow-md flex-shrink-0 flex flex-col p-6 lg:p-8 z-10 border-l lg:border-l-0 border-gray-200">
                            
                            <h2 className="text-2xl font-extrabold text-gray-800 border-b-4 border-indigo-500 pb-2 inline-block mb-8">ჯამური მონაცემები</h2>
                            
                            <div className="space-y-6 flex-grow">
                                <div className="flex justify-between items-center p-5 bg-gray-50 rounded-xl border border-gray-100 shadow-sm">
                                    <span className="text-gray-600 font-bold text-lg">სტუმრების რაოდენობა</span>
                                    <span className="text-3xl font-black text-indigo-600">{totals.totalConfirmedCount}</span>
                                </div>

                                <div className="flex justify-between items-center p-5 bg-gray-50 rounded-xl border border-gray-100 shadow-sm">
                                    <span className="text-gray-600 font-bold text-lg">ბინის გადასახადი</span>
                                    <span className="text-2xl font-extrabold text-gray-900">{totals.totalAccCost} ₾</span>
                                </div>

                                <div className="flex justify-between items-center p-5 bg-gray-50 rounded-xl border border-gray-100 shadow-sm">
                                    <span className="text-gray-600 font-bold text-lg">საკვების გადასახადი</span>
                                    <span className="text-2xl font-extrabold text-gray-900">{totals.totalFoodCost} ₾</span>
                                </div>
                            </div>

                            <div className="mt-8 pt-8 border-t-2 border-gray-100">
                                <button onClick={() => setShowMenuModal(true)} className="w-full bg-amber-500 hover:bg-amber-600 text-white font-extrabold py-5 px-6 rounded-2xl transition-all duration-300 shadow-lg shadow-amber-500/30 flex items-center justify-center gap-3 text-2xl hover:-translate-y-1">
                                    <Icons.Menu />
                                    მენიუ
                                </button>
                            </div>

                        </div>
                    </main>

                    {/* WIDE MENU MODAL */}
                    {showMenuModal && (
                        <div className="fixed inset-0 bg-gray-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl w-11/12 max-w-5xl max-h-[90vh] flex flex-col modal-animate overflow-hidden border border-gray-200">
                                
                                <div className="px-8 py-6 border-b-2 border-gray-100 flex justify-between items-center bg-gray-50">
                                    <div className="flex items-center gap-4">
                                        <div className="bg-amber-500 text-white p-3 rounded-xl shadow-md shadow-amber-500/20">
                                            <Icons.Menu />
                                        </div>
                                        <h2 className="text-3xl font-black text-gray-900 tracking-tight">სადღესასწაულო მენიუ</h2>
                                    </div>
                                    <button onClick={() => setShowMenuModal(false)} className="text-gray-400 hover:text-gray-800 p-2 rounded-full hover:bg-gray-200 transition-colors bg-white shadow-sm border border-gray-200">
                                        <Icons.Close />
                                    </button>
                                </div>
                                
                                <div className="p-8 overflow-y-auto flex-grow bg-white">
                                    
                                    <table className="w-full text-left border-collapse border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                                        <thead className="bg-gray-100 text-gray-700 text-lg">
                                            <tr>
                                                <th className="py-5 px-6 font-extrabold border-b border-gray-200">საკვები</th>
                                                <th className="py-5 px-6 font-extrabold border-b border-gray-200">პორცია</th>
                                                <th className="py-5 px-6 font-extrabold border-b border-gray-200 text-right">თანხა ამ საკვებზე</th>
                                                {isAdmin && <th className="py-5 px-6 border-b border-gray-200 w-16"></th>}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100 text-lg">
                                            {menuItems.length === 0 ? (
                                                <tr><td colSpan="4" className="py-12 text-center text-gray-400 font-bold">მენიუ ცარიელია</td></tr>
                                            ) : menuItems.map(item => (
                                                <tr key={item.id} className="hover:bg-gray-50/50 transition-colors group">
                                                    <td className="py-5 px-6 font-bold text-gray-900">{item.name}</td>
                                                    <td className="py-5 px-6 text-gray-600 font-medium">{item.portion}</td>
                                                    <td className="py-5 px-6 text-right">
                                                        {isAdmin ? (
                                                            <div className="flex justify-end items-center gap-2">
                                                                <input 
                                                                    type="number" min="0" value={item.price} 
                                                                    onChange={(e) => handleUpdateFoodPrice(item.id, e.target.value)}
                                                                    className="w-32 text-right bg-amber-50 border-2 border-amber-200 text-amber-900 font-extrabold rounded-xl px-4 py-2 focus:outline-none focus:border-amber-500 focus:ring-4 focus:ring-amber-500/20 text-xl"
                                                                />
                                                                <span className="text-gray-500 font-bold text-xl">₾</span>
                                                            </div>
                                                        ) : (
                                                            item.price > 0 ? (
                                                                <span className="text-2xl font-black text-gray-900 bg-gray-100 px-4 py-1.5 rounded-xl border border-gray-200 inline-block min-w-[100px] text-center shadow-inner">{item.price} ₾</span>
                                                            ) : (
                                                                <span className="text-sm text-gray-400 italic font-bold">ფასი მითითებული არ არის</span>
                                                            )
                                                        )}
                                                    </td>
                                                    {isAdmin && (
                                                        <td className="py-5 px-6 text-center">
                                                            <button onClick={() => handleDeleteFood(item.id)} className="text-gray-300 hover:text-rose-500 p-2 opacity-0 group-hover:opacity-100 transition-all rounded-full hover:bg-rose-50">
                                                                <Icons.Trash />
                                                            </button>
                                                        </td>
                                                    )}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>

                                    <div className="mt-8 flex justify-end">
                                        <div className="bg-gray-900 text-white px-8 py-5 rounded-2xl shadow-xl flex items-center gap-4">
                                            <span className="text-gray-300 font-bold text-xl uppercase tracking-wider">საერთო ჯამი:</span>
                                            <span className="text-4xl font-black text-amber-400">{totals.totalMenuPrice} ₾</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-8 border-t-4 border-gray-100 bg-gray-50">
                                    <h3 className="text-xl font-extrabold text-gray-800 mb-6 flex items-center gap-2">
                                        <Icons.Plus /> დამატება
                                    </h3>
                                    <form onSubmit={handleAddFood} className="flex flex-col md:flex-row gap-4">
                                        <div className="flex-1">
                                            <input required type="text" placeholder="საკვები (მაგ. ხინკალი)" value={newFood.name} onChange={e => setNewFood({...newFood, name: e.target.value})} className="w-full bg-white border-2 border-gray-200 rounded-xl px-5 py-4 text-lg font-bold focus:outline-none focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 shadow-sm transition-all" />
                                        </div>
                                        <div className="flex-1">
                                            <input required type="text" placeholder="პორცია (მაგ. 20 ცალი)" value={newFood.portion} onChange={e => setNewFood({...newFood, portion: e.target.value})} className="w-full bg-white border-2 border-gray-200 rounded-xl px-5 py-4 text-lg font-bold focus:outline-none focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 shadow-sm transition-all" />
                                        </div>
                                        <button type="submit" className="bg-amber-500 text-white rounded-xl px-10 py-4 text-xl font-black hover:bg-amber-600 transition-all shadow-lg shadow-amber-500/30 flex-shrink-0 flex items-center justify-center hover:-translate-y-1">
                                            დამატება
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {showLoginModal && (
                        <div className="fixed inset-0 bg-gray-900/70 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm modal-animate overflow-hidden border border-gray-200">
                                <div className="bg-gray-900 p-8 text-center text-white">
                                    <div className="w-20 h-20 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-4 backdrop-blur-md border border-white/20">
                                        <Icons.Lock />
                                    </div>
                                    <h2 className="text-3xl font-black tracking-tight">ადმინისტრატორი</h2>
                                </div>
                                <form onSubmit={handleLogin} className="p-8">
                                    <div className="mb-6">
                                        <label className="block text-sm font-bold text-gray-500 uppercase tracking-wider mb-2 text-center">შეიყვანეთ კოდი</label>
                                        <input 
                                            type="password" 
                                            placeholder="••••••" 
                                            value={passwordInput}
                                            onChange={(e) => setPasswordInput(e.target.value)}
                                            className="w-full text-center text-3xl tracking-[0.4em] font-black bg-gray-50 border-2 border-gray-200 rounded-2xl px-4 py-4 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 focus:bg-white transition-all shadow-inner"
                                            autoFocus
                                        />
                                    </div>
                                    <div className="flex gap-4">
                                        <button type="button" onClick={() => {setShowLoginModal(false); setPasswordInput('');}} className="flex-1 bg-gray-100 text-gray-700 font-bold text-lg rounded-xl px-4 py-4 hover:bg-gray-200 transition-colors border border-gray-200">
                                            გაუქმება
                                        </button>
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white font-bold text-lg rounded-xl px-4 py-4 hover:bg-indigo-700 shadow-lg shadow-indigo-600/30 transition-all hover:-translate-y-1">
                                            შესვლა
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* TOAST NOTIFICATIONS (Bottom Right) */}
                    <div className="fixed bottom-6 right-6 z-[70] flex flex-col gap-3 pointer-events-none">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`toast-enter pointer-events-auto flex items-center gap-3 px-5 py-4 rounded-xl shadow-xl border-l-4 min-w-[300px] max-w-sm
                                ${toast.type === 'error' ? 'bg-white border-rose-500 text-gray-800' : 'bg-gray-900 border-emerald-500 text-white'}`}>
                                <div className={toast.type === 'error' ? 'text-rose-500' : 'text-emerald-400'}>
                                    {toast.type === 'error' ? <Icons.Warning /> : <Icons.Check />}
                                </div>
                                <p className="font-bold text-sm leading-tight">{toast.message}</p>
                            </div>
                        ))}
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
