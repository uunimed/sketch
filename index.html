    {
        "imports": {

    <style>

        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        /* Loader Animation */

        /* Disable Selection for Password */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;

            user-select: none;

        /* ----- PRINT STYLES FOR MENU PDF ----- */
        @media print {
            @page {
                size: landscape;
                margin: 1cm;

            body * {
                visibility: hidden;

            }
            .no-print, .no-print * {

<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, onValue, set, update, remove, push } from 'firebase/database';

        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyAEbSWfiZ6xGL7_NoVVFpy-JkGwebb78RQ",
            authDomain: "using-6af8b.firebaseapp.com",
            projectId: "using-6af8b",
            storageBucket: "using-6af8b.firebasestorage.app",
            messagingSenderId: "316715965452",
            appId: "1:316715965452:web:8a07ffdf5905a571cc2229",
            measurementId: "G-XNXV9CRKEG"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Default Category Order
        const DEFAULT_CATEGORIES = [
            'საკვები', 
            'სასმელი', 
            'ერთჯერადი მასალა', 
            'სნექი', 
            'ხორცეული', 
            'ცომეული', 
            'ბოსტნეული'
        ];

        // მკვეთრი ფერები ტიპებისთვის
        const CATEGORY_COLORS = {
            'საკვები': 'bg-blue-100 hover:bg-blue-200 border-l-4 border-blue-500',
            'სასმელი': 'bg-cyan-100 hover:bg-cyan-200 border-l-4 border-cyan-500',
            'ერთჯერადი მასალა': 'bg-slate-200 hover:bg-slate-300 border-l-4 border-slate-500',
            'სნექი': 'bg-fuchsia-100 hover:bg-fuchsia-200 border-l-4 border-fuchsia-500',
            'ხორცეული': 'bg-rose-100 hover:bg-rose-200 border-l-4 border-rose-500',
            'ცომეული': 'bg-amber-100 hover:bg-amber-200 border-l-4 border-amber-500',
            'ბოსტნეული': 'bg-emerald-100 hover:bg-emerald-200 border-l-4 border-emerald-500'
        };

        // მკვეთრი ფერები მაღაზიებისთვის
        const SHOP_COLORS = [
            'bg-violet-100 hover:bg-violet-200 border-l-4 border-violet-500',
            'bg-orange-100 hover:bg-orange-200 border-l-4 border-orange-500',
            'bg-teal-100 hover:bg-teal-200 border-l-4 border-teal-500',
            'bg-pink-100 hover:bg-pink-200 border-l-4 border-pink-500',
            'bg-indigo-100 hover:bg-indigo-200 border-l-4 border-indigo-500',
            'bg-lime-100 hover:bg-lime-200 border-l-4 border-lime-500'
        ];

        // UI Icons
        const Icons = {
            Event: ({ className }) => <svg className={className || "w-5 h-5 md:w-6 md:h-6"} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 11a2 2 0 100 4 2 2 0 000-4z"></path></svg>,
            Refresh: ({ className }) => <svg className={className || "w-4 h-4 md:w-5 md:h-5"} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>,
            Settings: () => <svg className="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Lock: () => <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>,
            Unlock: () => <svg className="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>,
            Menu: () => <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>,
            Plus: () => <svg className="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
            Close: () => <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
            Trash: () => <svg className="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
            Check: () => <svg className="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>,
            Warning: () => <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>,
            Print: () => <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>,
            Drag: () => <svg className="w-4 h-4 text-slate-500 cursor-move hover:text-slate-800 transition-colors mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8h16M4 16h16"></path></svg>,
            FolderDrag: () => <svg className="w-4 h-4 text-indigo-600 cursor-move hover:text-indigo-900 transition-colors mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
        };

        const App = () => {
            const [guests, setGuests] = useState([]);
            const [menuItems, setMenuItems] = useState([]);
            const [categoryOrder, setCategoryOrder] = useState(DEFAULT_CATEGORIES);
            const [aptTotal, setAptTotal] = useState(0);

            const [isAdmin, setIsAdmin] = useState(false);
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [showMenuModal, setShowMenuModal] = useState(false);
            const [confirmDialog, setConfirmDialog] = useState(null);
            
            const [sortByShopActive, setSortByShopActive] = useState(false);
            
            const [editingGuestApt, setEditingGuestApt] = useState(null);
            const [customAptInput, setCustomAptInput] = useState('');

            const [passwordInput, setPasswordInput] = useState('');
            const [toasts, setToasts] = useState([]);

            const [newGuest, setNewGuest] = useState({ firstName: '', lastName: '', status: 'დასაზუსტებელი' });
            const [newFood, setNewFood] = useState({ name: '', category: 'საკვები', portion: '', shop: '' });
            
            const [draggedItem, setDraggedItem] = useState(null);
            const [draggedCategory, setDraggedCategory] = useState(null);

            const inputDebounceRef = useRef({});

            const showToast = useCallback((message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
            }, []);

            const requestConfirmation = (title, message, onConfirm) => {
                setConfirmDialog({ title, message, onConfirm });
            };

            const handleLocalRefresh = () => {
                setIsLoadingData(true);
                setTimeout(() => {
                    setIsLoadingData(false);
                    showToast('მონაცემები განახლებულია', 'success');
                }, 600);
            };

            useEffect(() => {
                const dbRef = ref(db, 'event/main');
                
                const unsubscribe = onValue(dbRef, (snapshot) => {
                    const data = snapshot.val();
                    
                    if (data) {
                        const fetchedGuests = data.guests ? Object.keys(data.guests).map(key => ({ id: key, ...data.guests[key] })) : [];
                        const fetchedMenu = data.menuItems ? Object.keys(data.menuItems).map(key => ({ id: key, ...data.menuItems[key] })) : [];
                        const fetchedCatOrder = data.categoryOrder || DEFAULT_CATEGORIES;
                        
                        setGuests(fetchedGuests);
                        setMenuItems(fetchedMenu);
                        setCategoryOrder(fetchedCatOrder);
                        setAptTotal(data.aptTotal || 0);
                    } else {
                        set(dbRef, { aptTotal: 0, categoryOrder: DEFAULT_CATEGORIES });
                    }
                    setIsLoadingData(false);
                }, (error) => {
                    console.error("Firebase Error: ", error);
                    setIsLoadingData(false);
                    if (error.message.includes('permission_denied')) {
                        showToast('შეცდომა: მონაცემების წაკითხვის უფლება არ გაქვთ.', 'error');
                    } else {
                        showToast('მონაცემების ჩატვირთვა ვერ მოხერხდა.', 'error');
                    }
                });

                return () => unsubscribe();
            }, [showToast]);

            const sortedGroupedMenu = useMemo(() => {
                if (sortByShopActive) {
                    return [...menuItems].sort((a, b) => {
                        const shopA = (a.shop || 'სხვა').trim().toLowerCase();
                        const shopB = (b.shop || 'სხვა').trim().toLowerCase();
                        return shopA.localeCompare(shopB);
                    });
                } else {
                    const result = [];
                    const activeCategories = [...new Set([...categoryOrder, ...menuItems.map(i => i.category || 'საკვები')])];
                    
                    activeCategories.forEach(cat => {
                        const itemsInCat = menuItems
                            .filter(item => (item.category || 'საკვები') === cat)
                            .sort((a, b) => (a.order || 0) - (b.order || 0));
                        result.push(...itemsInCat);
                    });
                    return result;
                }
            }, [menuItems, categoryOrder, sortByShopActive]);

            const stats = useMemo(() => {
                const confirmedGuests = guests.filter(g => g.status === 'დაზუსტებული');
                const confirmedCount = confirmedGuests.length;
                
                const foodTotal = menuItems.reduce((sum, item) => {
                    const price = Number(item.unitPrice) || 0;
                    const qty = Number(item.quantity) || 0;
                    return sum + (price * qty);
                }, 0);

                const totalApt = Number(aptTotal) || 0;
                const totalEventCost = totalApt + foodTotal;
                
                const perPersonFairShare = confirmedCount > 0 ? totalEventCost / confirmedCount : 0;
                const standardAptPerPerson = confirmedCount > 0 ? totalApt / confirmedCount : 0;

                let sumCustomApt = 0;
                let customCount = 0;
                confirmedGuests.forEach(g => {
                    if (g.customAptCost !== undefined && g.customAptCost !== null && g.customAptCost !== '') {
                        sumCustomApt += Number(g.customAptCost);
                        customCount++;
                    }
                });

                const regularCount = confirmedCount - customCount;
                const remainingAptToSplit = totalApt - sumCustomApt;
                const regularAptShare = regularCount > 0 ? remainingAptToSplit / regularCount : 0;
                const foodPerPerson = confirmedCount > 0 ? foodTotal / confirmedCount : 0;

                return { 
                    confirmedCount, 
                    foodTotal, 
                    totalApt,
                    foodPerPerson,
                    perPersonFairShare,
                    standardAptPerPerson,
                    regularAptShare 
                };
            }, [guests, menuItems, aptTotal]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === '200011') {
                    setIsAdmin(true);
                    setShowLoginModal(false);
                    setPasswordInput('');
                    showToast('ადმინისტრატორის რეჟიმი გააქტიურდა');
                } else {
                    showToast('არასწორი პაროლი', 'error');
                }
            };

            const handleAddGuest = (e) => {
                e.preventDefault();
                if (!newGuest.firstName.trim() || !newGuest.lastName.trim()) {
                    showToast('შეავსეთ სახელი და გვარი', 'error');
                    return;
                }
                
                requestConfirmation('სტუმრის დამატება', `ნამდვილად გსურთ დაამატოთ სტუმარი: ${newGuest.firstName} ${newGuest.lastName}?`, () => {
                    const guestsRef = ref(db, 'event/main/guests');
                    const newGuestRef = push(guestsRef);
                    set(newGuestRef, newGuest).then(() => {
                        setNewGuest({ firstName: '', lastName: '', status: 'დასაზუსტებელი' });
                        showToast('სტუმარი წარმატებით დაემატა');
                    });
                });
            };

            const handleDeleteGuest = (id) => {
                requestConfirmation('სტუმრის წაშლა', 'ნამდვილად გსურთ ამ სტუმრის სიიდან წაშლა?', () => {
                    remove(ref(db, `event/main/guests/${id}`)).then(() => showToast('სტუმარი წაიშალა', 'success'));
                });
            };

            const handleStatusChange = (id, newStatus) => {
                requestConfirmation('სტატუსის შეცვლა', 'ნამდვილად გსურთ სტუმრის სტატუსის შეცვლა?', () => {
                    update(ref(db, `event/main/guests/${id}`), { status: newStatus })
                        .then(() => showToast('სტატუსი განახლდა'));
                });
            };

            const handleSaveCustomApt = () => {
                if (!editingGuestApt) return;
                
                const valueToSave = customAptInput.trim() === '' ? null : Number(customAptInput);
                
                update(ref(db, `event/main/guests/${editingGuestApt.id}`), { customAptCost: valueToSave })
                    .then(() => {
                        setEditingGuestApt(null);
                        showToast(valueToSave === null ? 'დაბრუნდა ნაგულისხმევზე' : 'ინდივიდუალური თანხა შეინახა');
                    });
            };

            const handleAddFood = (e) => {
                e.preventDefault();
                if (!newFood.name.trim() || !newFood.portion.trim()) {
                    showToast('შეავსეთ სავალდებულო ველები', 'error');
                    return;
                }

                requestConfirmation('კერძის დამატება', `ნამდვილად გსურთ დაამატოთ მენიუში: ${newFood.name}?`, () => {
                    const menuRef = ref(db, 'event/main/menuItems');
                    const newFoodRef = push(menuRef);
                    
                    const itemsInSameCategory = menuItems.filter(i => (i.category || 'საკვები') === newFood.category);
                    const nextOrder = itemsInSameCategory.length;
                    
                    const foodData = { 
                        name: newFood.name, 
                        category: newFood.category,
                        portion: newFood.portion, 
                        shop: newFood.shop || '',
                        unit: '', 
                        unitPrice: '', 
                        quantity: '', 
                        order: nextOrder
                    };
                    
                    set(newFoodRef, foodData).then(() => {
                        setNewFood({ name: '', category: 'საკვები', portion: '', shop: '' });
                        showToast('კერძი დაემატა მენიუში');
                    });
                });
            };

            const handleDeleteFood = (id) => {
                requestConfirmation('კერძის წაშლა', 'ნამდვილად გსურთ მენიუდან ამ კერძის წაშლა?', () => {
                    remove(ref(db, `event/main/menuItems/${id}`)).then(() => showToast('კერძი წაიშალა მენიუდან', 'success'));
                });
            };

            const handleUpdateFood = (id, field, value) => {
                setMenuItems(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
                
                const debounceKey = `food_${id}_${field}`;
                if (inputDebounceRef.current[debounceKey]) clearTimeout(inputDebounceRef.current[debounceKey]);
                
                inputDebounceRef.current[debounceKey] = setTimeout(() => {
                    update(ref(db, `event/main/menuItems/${id}`), { [field]: value });
                }, 600);
            };

            const handleMenuReorder = (dragItem, dropItem) => {
                if (sortByShopActive) return;
                if (!dragItem || !dropItem || dragItem.id === dropItem.id) return;
                
                const dragCat = dragItem.category || 'საკვები';
                const dropCat = dropItem.category || 'საკვები';

                if (dragCat !== dropCat) {
                    showToast('გადაადგილება შესაძლებელია მხოლოდ ერთი ტიპის შიგნით', 'error');
                    return;
                }

                const categoryItems = menuItems
                    .filter(i => (i.category || 'საკვები') === dragCat)
                    .sort((a, b) => (a.order || 0) - (b.order || 0));
                
                const dragIdx = categoryItems.findIndex(i => i.id === dragItem.id);
                const dropIdx = categoryItems.findIndex(i => i.id === dropItem.id);

                if (dragIdx === -1 || dropIdx === -1) return;

                const reorderedItems = [...categoryItems];
                const [removed] = reorderedItems.splice(dragIdx, 1);
                reorderedItems.splice(dropIdx, 0, removed);
                
                const updates = {};
                const newMenuItemsState = [...menuItems]; 
                
                reorderedItems.forEach((item, index) => {
                    updates[`${item.id}/order`] = index;
                    const stateIdx = newMenuItemsState.findIndex(i => i.id === item.id);
                    if (stateIdx > -1) newMenuItemsState[stateIdx].order = index;
                });
                
                setMenuItems(newMenuItemsState);
                update(ref(db, 'event/main/menuItems'), updates).catch(() => showToast('შეცდომა განახლებისას', 'error'));
            };

            const handleCategoryReorder = (dragCat, dropCat) => {
                if (sortByShopActive) return;
                if (!dragCat || !dropCat || dragCat === dropCat) return;

                const activeCategories = [...new Set([...categoryOrder, ...menuItems.map(i => i.category || 'საკვები')])];

                const dropIdx = activeCategories.indexOf(dropCat);

                const newOrder = [...activeCategories];
                const [removed] = newOrder.splice(dragIdx, 1);
                newOrder.splice(dropIdx, 0, removed);

                                        )}
                                        <button onClick={() => setShowMenuModal(false)} className="no-print text-slate-400 hover:text-slate-800 p-1 md:p-1.5 rounded-md hover:bg-slate-200 transition-colors">
                                            <Icons.Close />
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="flex-grow overflow-y-auto p-2 md:p-6 bg-slate-50/50 flex flex-col">
                                    <div className="bg-white border border-slate-200 rounded-lg md:rounded-xl shadow-sm overflow-x-auto flex-grow">
                                        <table className="w-full text-left border-collapse min-w-[500px] md:min-w-[850px]">
                                            <thead className="bg-slate-100 text-slate-500 text-[8px] md:text-[10px] font-bold uppercase tracking-wider border-b border-slate-200 sticky top-0 z-10">
                                                <tr>
                                                    {isAdmin && !sortByShopActive && <th className="py-2 md:py-3 px-1 w-6 md:w-8 text-center no-print" title="ტიპის გადაადგილება"></th>}
                                                    {isAdmin && !sortByShopActive && <th className="py-2 md:py-3 px-1 w-6 md:w-8 text-center no-print" title="პროდუქტის გადაადგილება"></th>}
                                                    <th className="py-2 md:py-3 px-2 md:px-3 w-1/4">საკვები</th>
                                                    {isAdmin && <th className="py-2 md:py-3 px-2 md:px-3 no-print w-32">ტიპი (ადმინ)</th>}
                                                    <th className="py-2 md:py-3 px-2 md:px-3 text-center">ერთეული</th>
                                                    <th className="py-2 md:py-3 px-2 md:px-3 text-right">ერთ. ფასი</th>
                                                    <th className="py-2 md:py-3 px-2 md:px-3 text-center">რაოდენობა</th>
                                                    <th className="py-2 md:py-3 px-2 md:px-3 text-right text-amber-700">თანხა ამ საკვებზე</th>
                                                    {/* მაღაზია გადატანილია ბოლოში */}
                                                    <th className="py-2 md:py-3 px-2 md:px-3 w-28">მაღაზია</th>
                                                    {isAdmin && <th className="py-2 md:py-3 px-1 md:px-2 w-6 md:w-10 no-print"></th>}
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-200">
                                                {sortedGroupedMenu.length === 0 ? (
                                                    <tr><td colSpan={isAdmin ? 10 : 6} className="py-6 md:py-8 text-center text-slate-400 font-bold text-xs md:text-sm">მენიუ ცარიელია</td></tr>
                                                ) : sortedGroupedMenu.map((item, index) => {
                                                    const price = Number(item.unitPrice) || 0;
                                                    const qty = Number(item.quantity) || 0;
                                                    const itemTotal = price * qty;
                                                    const isMissingData = item.unitPrice === '' || item.unitPrice == null || item.quantity === '' || item.quantity == null;
                                                    const currentCat = item.category || 'საკვები';
                                                    
                                                    let rowBgClass = CATEGORY_COLORS[currentCat] || 'bg-slate-100';
                                                    if (sortByShopActive) {
                                                        const shopName = (item.shop || 'სხვა').trim();
                                                        let colorIdx = 0;
                                                        for (let i = 0; i < shopName.length; i++) colorIdx += shopName.charCodeAt(i);
                                                        rowBgClass = SHOP_COLORS[colorIdx % SHOP_COLORS.length];
                                                    }

                                                    const catItems = sortedGroupedMenu.filter(i => (i.category || 'საკვები') === currentCat);
                                                    const isFirstInCategory = catItems[0]?.id === item.id;

                                                    return (
                                                        <tr 
                                                            key={item.id} 
                                                            className={`transition-colors group ${rowBgClass}`}
                                                            draggable={isAdmin && !sortByShopActive}
                                                            onDragStart={() => setDraggedItem(item)}
                                                            onDragOver={(e) => e.preventDefault()}
                                                            onDrop={(e) => {
                                                                e.preventDefault();
                                                                if (!sortByShopActive && draggedItem !== null) handleMenuReorder(draggedItem, item);
                                                                setDraggedItem(null);
                                                            }}
                                                        >
                                                            {isAdmin && !sortByShopActive && (
                                                                <td className="py-1.5 md:py-2.5 px-0.5 text-center align-middle no-print">
                                                                    {isFirstInCategory ? (
                                                                        <div 
                                                                            draggable="true"
                                                                            onDragStart={(e) => {
                                                                                e.stopPropagation();
                                                                                setDraggedCategory(currentCat);
                                                                            }}
                                                                            onDragOver={(e) => e.preventDefault()}
                                                                            onDrop={(e) => {
                                                                                e.preventDefault();
                                                                                e.stopPropagation();
                                                                                if (draggedCategory) {
                                                                                    handleCategoryReorder(draggedCategory, currentCat);
                                                                                    setDraggedCategory(null);
                                                                                }
                                                                            }}
                                                                            title={`ტიპის ("${currentCat}") გადაადგილება`}
                                                                            className="cursor-grab active:cursor-grabbing inline-block p-1 bg-white/80 rounded shadow-sm hover:bg-white"
                                                                        >
                                                                            <Icons.FolderDrag />
                                                                        </div>
                                                                    ) : null}
                                                                </td>
                                                            )}

                                                            {isAdmin && !sortByShopActive && (
                                                                <td className="py-1.5 md:py-2.5 px-0.5 text-center align-middle no-print">
                                                                    <div title="პროდუქტის გადაადგილება" className="cursor-move inline-block">
                                                                        <Icons.Drag />
                                                                    </div>
                                                                </td>
                                                            )}

                                                            <td className="py-1.5 md:py-2.5 px-2 md:px-3">
                                                                <div className="font-bold text-slate-900 text-[10px] md:text-sm">{item.name}</div>
                                                                {item.portion && (
                                                                    <div className="text-[8px] md:text-[10px] text-slate-700 mt-0.5 font-bold bg-white/70 inline-block px-1 md:px-1.5 py-0.5 rounded border border-slate-300 shadow-sm">
                                                                        მოთხოვნილი: {item.portion}
                                                                    </div>
                                                                )}
                                                            </td>

                                                            {isAdmin && (
                                                                <td className="py-1.5 md:py-2.5 px-2 md:px-3 no-print">
                                                                    <select 
                                                                        value={currentCat} 
                                                                        onChange={(e) => handleUpdateFood(item.id, 'category', e.target.value)}
                                                                        className="w-full bg-white border border-slate-300 rounded px-1.5 py-1 text-[10px] font-bold text-slate-800 outline-none focus:ring-1 focus:ring-amber-500 shadow-sm cursor-pointer"
                                                                    >
                                                                        {DEFAULT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                                                    </select>
                                                                </td>
                                                            )}
                                                            
                                                            <td className="py-1.5 md:py-2.5 px-2 md:px-3 text-center">
                                                                {isAdmin ? (
                                                                    <input type="text" placeholder="ცალი" value={item.unit} onChange={e => handleUpdateFood(item.id, 'unit', e.target.value)} className="w-10 md:w-16 bg-white border border-slate-300 rounded px-1 md:px-2 py-0.5 md:py-1 text-[10px] md:text-xs focus:ring-1 focus:ring-amber-500 outline-none text-center shadow-sm" />
                                                                ) : (
                                                                    <span className="text-[10px] md:text-xs font-medium text-slate-800">{item.unit || '-'}</span>
                                                                )}
                                                            </td>

                                                            <td className="py-1.5 md:py-2.5 px-2 md:px-3 text-right">
                                                                {isAdmin ? (
                                                                    <div className="flex justify-end items-center gap-1">
                                                                        <input type="number" min="0" placeholder="0" value={item.unitPrice} onChange={e => handleUpdateFood(item.id, 'unitPrice', e.target.value)} className="w-12 md:w-16 text-right bg-white border border-slate-300 rounded px-1 md:px-2 py-0.5 md:py-1 text-[10px] md:text-xs font-bold focus:ring-1 focus:ring-amber-500 outline-none shadow-sm" />
                                                                        <span className="text-slate-600 text-[8px] md:text-xs">₾</span>
                                                                    </div>
                                                                ) : (
                                                                    <span className="text-[10px] md:text-xs font-bold text-slate-900">{item.unitPrice !== '' && item.unitPrice != null ? `${item.unitPrice} ₾` : '-'}</span>
                                                                )}
                                                            </td>
                                                            
                                                            <td className="py-1.5 md:py-2.5 px-2 md:px-3 text-center">
                                                                {isAdmin ? (
                                                                    <input type="number" min="0" placeholder="0" value={item.quantity} onChange={e => handleUpdateFood(item.id, 'quantity', e.target.value)} className="w-10 md:w-14 text-center bg-white border border-slate-300 rounded px-1 md:px-2 py-0.5 md:py-1 text-[10px] md:text-xs font-bold focus:ring-1 focus:ring-amber-500 outline-none mx-auto block shadow-sm" />
                                                                ) : (
                                                                    <span className="text-[10px] md:text-xs font-bold text-slate-900">{item.quantity !== '' && item.quantity != null ? item.quantity : '-'}</span>
                                                                )}
                                                            </td>

                                                            <td className="py-1.5 md:py-2.5 px-2 md:px-3 text-right align-middle">
                                                                {isMissingData ? (
                                                                    <span className="text-[8px] md:text-[10px] font-bold text-amber-800 bg-amber-200 px-1 md:px-2 py-0.5 md:py-1 rounded border border-amber-300 block md:inline-block text-center shadow-sm">
                                                                        ფასს დაამატებს ადმინი
                                                                    </span>
                                                                ) : (
                                                                    <span className="text-[10px] md:text-sm font-black text-slate-950 block min-w-[50px] text-right">
                                                                        {itemTotal} ₾
                                                                    </span>
                                                                )}
                                                            </td>

                                                            {/* მაღაზიის სვეტი გადატანილია თანხის მერე */}
                                                            <td className="py-1.5 md:py-2.5 px-2 md:px-3">
                                                                {isAdmin ? (
                                                                    <input 
                                                                        type="text" 
                                                                        placeholder="მაღაზია" 
                                                                        value={item.shop || ''} 
                                                                        onChange={e => handleUpdateFood(item.id, 'shop', e.target.value)} 
                                                                        className="w-full bg-white border border-slate-300 rounded px-1.5 py-1 text-[10px] md:text-xs font-bold text-slate-800 outline-none focus:ring-1 focus:ring-amber-500 shadow-sm" 
                                                                    />
                                                                ) : (
                                                                    <span className="text-[10px] md:text-xs font-bold text-slate-700">{item.shop || '-'}</span>
                                                                )}
                                                            </td>

                                                            {isAdmin && (
                                                                <td className="py-1.5 md:py-2.5 px-1 md:px-2 text-center no-print">
                                                                    <button onClick={() => handleDeleteFood(item.id)} className="text-slate-500 hover:text-rose-600 p-0.5 md:p-1 rounded hover:bg-rose-200 transition-all opacity-0 group-hover:opacity-100">
                                                                        <Icons.Trash />
                                                                    </button>
                                                                </td>
                                                            )}
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                    
                                    {/* Summary Block */}
                                    {isAdmin ? (
                                        <div className="mt-3 md:mt-4 grid grid-cols-2 md:grid-cols-5 gap-2 md:gap-3 shrink-0">
                                            <div className="bg-slate-100 border border-slate-200 px-2 py-2 md:py-3 rounded-lg flex flex-col items-center justify-center text-center">
                                                <span className="text-slate-500 font-bold text-[8px] md:text-[9px] uppercase mb-0.5">სტუმრები სულ</span>
                                                <span className="text-sm md:text-base font-black text-slate-800">{stats.confirmedCount}</span>
                                            </div>
                                            <div className="bg-slate-100 border border-slate-200 px-2 py-2 md:py-3 rounded-lg flex flex-col items-center justify-center text-center">
                                                <span className="text-slate-500 font-bold text-[8px] md:text-[9px] uppercase mb-0.5">ბინის გადასახადი</span>
                                                <span className="text-sm md:text-base font-black text-slate-800">{stats.totalApt} ₾</span>
                                            </div>
                                            <div className="bg-slate-100 border border-slate-200 px-2 py-2 md:py-3 rounded-lg flex flex-col items-center justify-center text-center">
                                                <span className="text-slate-500 font-bold text-[8px] md:text-[9px] uppercase mb-0.5">საკვების საშ. გადასახადი</span>
                                                <span className="text-sm md:text-base font-black text-slate-800">{stats.foodPerPerson.toFixed(1)} ₾</span>
                                            </div>
                                            <div className="bg-indigo-50 border border-indigo-200 px-2 py-2 md:py-3 rounded-lg flex flex-col items-center justify-center text-center">
                                                <span className="text-indigo-600 font-bold text-[8px] md:text-[9px] uppercase mb-0.5">1 სტუმარზე ჯამური (სავარაუდო)</span>
                                                <span className="text-sm md:text-base font-black text-indigo-700">{stats.perPersonFairShare.toFixed(1)} ₾</span>
                                            </div>
                                            <div className="bg-slate-800 border border-slate-800 px-2 py-2 md:py-3 rounded-lg flex flex-col items-center justify-center text-center shadow col-span-2 md:col-span-1 print-total-box">
                                                <span className="text-slate-300 font-bold text-[8px] md:text-[9px] uppercase mb-0.5">მთლიანი საკვების ჯამი</span>
                                                <span className="text-sm md:text-lg font-black text-amber-400">{stats.foodTotal} ₾</span>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="mt-2 md:mt-4 flex justify-end shrink-0">
                                            <div className="bg-slate-800 text-white px-3 md:px-5 py-2 md:py-3 rounded-lg md:rounded-xl shadow flex items-center gap-2 md:gap-3">
                                                <span className="text-slate-300 font-bold text-[8px] md:text-[10px] uppercase">საკვების ჯამი:</span>
                                                <span className="text-sm md:text-lg font-black text-amber-400">{stats.foodTotal} ₾</span>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Menu Item Adding Form */}
                                <div className="p-3 md:p-4 border-t border-slate-200 bg-white shrink-0 no-print">
                                    <form onSubmit={handleAddFood} className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-2 md:gap-3 items-end">
                                        <div>
                                            <label className="block text-[9px] md:text-[10px] uppercase font-bold text-slate-500 mb-1 ml-1">სახელი</label>
                                            <input required type="text" placeholder="მაგ. ხაჭაპური" value={newFood.name} onChange={e => setNewFood({...newFood, name: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-md md:rounded-lg px-2 py-1.5 md:px-3 md:py-2 text-[10px] md:text-xs font-bold focus:outline-none focus:ring-1 focus:ring-amber-500 focus:bg-white" />
                                        </div>
                                        <div>
                                            <label className="block text-[9px] md:text-[10px] uppercase font-bold text-slate-500 mb-1 ml-1">მაღაზია</label>
                                            <input type="text" placeholder="მაგ. ნიკორა" value={newFood.shop} onChange={e => setNewFood({...newFood, shop: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-md md:rounded-lg px-2 py-1.5 md:px-3 md:py-2 text-[10px] md:text-xs font-bold focus:outline-none focus:ring-1 focus:ring-amber-500 focus:bg-white" />
                                        </div>
                                        <div>
                                            <label className="block text-[9px] md:text-[10px] uppercase font-bold text-slate-500 mb-1 ml-1">ტიპი</label>
                                            <select value={newFood.category} onChange={e => setNewFood({...newFood, category: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-md md:rounded-lg px-2 py-1.5 md:px-3 md:py-2 text-[10px] md:text-xs font-bold focus:outline-none focus:ring-1 focus:ring-amber-500 focus:bg-white cursor-pointer text-slate-700">
                                                {DEFAULT_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[9px] md:text-[10px] uppercase font-bold text-slate-500 mb-1 ml-1">პორცია</label>
                                            <input required type="text" placeholder="მაგ. 3 ცალი" value={newFood.portion} onChange={e => setNewFood({...newFood, portion: e.target.value})} className="w-full bg-slate-50 border border-slate-200 rounded-md md:rounded-lg px-2 py-1.5 md:px-3 md:py-2 text-[10px] md:text-xs font-bold focus:outline-none focus:ring-1 focus:ring-amber-500 focus:bg-white" />
                                        </div>
                                        <button type="submit" className="bg-amber-500 text-white rounded-md md:rounded-lg px-4 md:px-5 py-1.5 md:py-2 text-[10px] md:text-xs font-black hover:bg-amber-600 transition-all shadow-sm w-full h-[32px] md:h-[34px]">
                                            დამატება
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Login Modal */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowLoginModal(false)}></div>
                            <div className="relative bg-white rounded-xl md:rounded-2xl shadow-xl w-full max-w-sm modal-enter overflow-hidden border border-slate-200">
                                <div className="p-6 md:p-8 text-center">
                                    <div className="w-10 h-10 md:w-14 md:h-14 bg-indigo-600 text-white rounded-lg md:rounded-xl flex items-center justify-center mx-auto mb-3 md:mb-4 shadow-md shadow-indigo-600/30">
                                        <Icons.Lock />
                                    </div>
                                    <form onSubmit={handleLogin}>
                                        <div className="mb-4 md:mb-6">
                                            <input 
                                                type="password" 
                                                value={passwordInput}
                                                onChange={(e) => setPasswordInput(e.target.value)}
                                                onCopy={e => e.preventDefault()}
                                                onPaste={e => e.preventDefault()}
                                                onCut={e => e.preventDefault()}
                                                onDragStart={e => e.preventDefault()}
                                                onSelect={e => e.preventDefault()}
                                                autoComplete="new-password"
                                                className="w-full text-center text-xl md:text-2xl tracking-[0.3em] font-black bg-slate-50 border border-slate-200 rounded-lg md:rounded-xl px-2 py-2.5 md:px-3 md:py-3 focus:outline-none focus:border-indigo-500 focus:bg-white transition-all text-slate-800 no-select"
                                                autoFocus
                                            />
                                        </div>
                                        <div className="flex gap-2 md:gap-3">
                                            <button type="button" onClick={() => {setShowLoginModal(false); setPasswordInput('');}} className="flex-1 bg-slate-100 text-slate-600 font-bold rounded-md md:rounded-lg px-2 py-2 md:px-3 md:py-2.5 hover:bg-slate-200 transition-colors text-xs md:text-sm">
                                                გაუქმება
                                            </button>
                                            <button type="submit" className="flex-1 bg-indigo-600 text-white font-bold rounded-md md:rounded-lg px-2 py-2 md:px-3 md:py-2.5 hover:bg-indigo-700 shadow transition-all text-xs md:text-sm">
                                                შესვლა
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Confirm Dialog */}
                    {confirmDialog && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setConfirmDialog(null)}></div>
                            <div className="relative bg-white rounded-xl md:rounded-2xl shadow-xl w-full max-w-sm modal-enter p-5 md:p-6 text-center border border-slate-200">
                                <div className="w-10 h-10 md:w-12 md:h-12 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-3 md:mb-4">
                                    <Icons.Warning />
                                </div>
                                <h3 className="text-base md:text-lg font-black text-slate-800 mb-1.5 md:mb-2">{confirmDialog.title}</h3>
                                <p className="text-slate-500 text-[10px] md:text-sm font-medium mb-4 md:mb-6 leading-relaxed">{confirmDialog.message}</p>
                                <div className="flex gap-2 md:gap-3">
                                    <button onClick={() => setConfirmDialog(null)} className="flex-1 bg-slate-100 text-slate-600 font-bold rounded-md md:rounded-lg py-2 md:py-2.5 hover:bg-slate-200 transition-colors text-xs md:text-sm">
                                        გაუქმება
                                    </button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="flex-1 bg-slate-800 text-white font-bold rounded-md md:rounded-lg py-2 md:py-2.5 hover:bg-slate-900 transition-colors text-xs md:text-sm">
                                        დადასტურება
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toasts */}
                    <div className="fixed bottom-4 right-4 z-[80] flex flex-col gap-2 pointer-events-none">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`toast-enter pointer-events-auto flex items-center gap-2 md:gap-2.5 px-3 py-2.5 md:px-4 md:py-3 rounded-lg shadow-lg border-l-4 min-w-[200px] md:min-w-[240px] max-w-sm bg-white
                                ${toast.type === 'error' ? 'border-rose-500 text-slate-800' : 'border-emerald-500 text-slate-800'}`}>
                                <div className={toast.type === 'error' ? 'text-rose-500' : 'text-emerald-500'}>
                                    {toast.type === 'error' ? <Icons.Warning /> : <Icons.Check />}
                                </div>
                                <p className="font-bold text-[10px] md:text-xs leading-snug">{toast.message}</p>
                            </div>
                        ))}
                    </div>

                    {/* Loader */}
                    {isLoadingData && (
                        <div className="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none z-[100]">
                            <svg className="w-10 h-10 md:w-12 md:h-12 text-indigo-600 spinner drop-shadow-md" fill="none" viewBox="0 0 24 24">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </div>
                    )}

                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
